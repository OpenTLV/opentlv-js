name: JS Full CI
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: js-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/js-checks.yml
    with:
      tier: full
  reproducibility:
    uses: ./.github/workflows/js-checks.yml
    with:
      tier: release
