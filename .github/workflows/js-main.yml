name: JS Main CI
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: js-main-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/js-checks.yml
    with:
      tier: main
