name: JS Pull Request CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: js-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/js-checks.yml
    with:
      tier: pr
